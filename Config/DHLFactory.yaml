behaviors:
  DHLFactory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128            # 시각 학습을 위해 배치 크기 증가
      buffer_size: 2048          # 버퍼 크기 증가
      learning_rate: 0.0003
      beta: 0.005                # 탐색 엔트로피 조정
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      vis_encode_type: simple    # 기본 CNN 인코더
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.9
        strength: 1.0
    max_steps: 150000            # 총 학습 스텝 수
    summary_freq: 2000